model_list:
  # Models are managed in the database (LiteLLM_ProxyModelTable)
  # while store_model_in_db=true. This list intentionally empty.

litellm_settings:
  callbacks:
    - single_gpu_guard.guard
  num_retries: 0
  request_timeout: 600
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
